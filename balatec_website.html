<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portefeuille Balatec — Grand Livre Multi-Devises Hors-Ligne</title>
    <meta name="description" content="Solution financière multi-devises hors-ligne d'abord, répertoire de bénéficiaires intelligents et hub de synchronisation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f8f5f0;
        --ink: #2c221e;
        --accent: #5c3a21;
        --ink-faint: rgba(44, 34, 30, 0.08);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        max-width: 800px;
        width: 100%;
        background: white;
        border: 1px solid #e2d6c3;
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        text-align: center;
      }
      h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 3rem;
        color: var(--accent);
        margin-bottom: 1rem;
      }
      p {
        font-size: 1rem;
        color: #665c54;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 1rem 2rem;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .btn:hover { background: #452b18; }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-family: 'Space Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8c7a6b; margin-bottom: 1rem;">[ Système Financier Hors-Ligne d'Abord ]</div>
      <h1>Portefeuille Balatec</h1>
      <p>Votre grand livre financier sécurisé avec synchronisation instantanée en ligne et hors-ligne, répertoire de bénéficiaires et rapports multi-devises (XOF, EUR, USD, CAD).</p>
      <a href="/" class="btn">Lancer l'Application Web</a>
    </div>
  </body>
</html>
